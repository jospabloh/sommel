name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # lint chains validate:functions, validate:locks, check:bridge and check:auth-me
      - run: npm run lint
      - run: npm run build
      - run: npm run validate:rls
      - run: npm run validate:tenant-roles
      - run: npm run check:guards
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Compiles every function against a stub SDK: a broken import never
      # reaches Base44, whose deploy fails silently and keeps the old code.
      - run: npm run check:functions
      - run: deno test --allow-env --allow-read=base44/entities base44/tests/ base44/functions/acaciaSign.test.ts
      # Supabase (migration phase 2): generate the Edge Functions from
      # base44/functions, compile them, and run them end to end in memory.
      - run: npm run check:supabase-functions
      - run: npm run test:supabase-functions
  supabase-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      # Plain Postgres: the stub emulates Supabase's roles and auth schema.
      - run: psql -v ON_ERROR_STOP=1 -1 -f supabase/tests/00_supabase_stub.sql
      # Every migration, in file-name order, each in its own transaction, so a
      # new one cannot be left out of this job.
      - run: for f in $(ls supabase/migrations/*.sql | sort); do echo "== $f"; psql -v ON_ERROR_STOP=1 -1 -f "$f" || exit 1; done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/isolation.sql

  # Phase 2 of the Supabase migration against a REAL local stack: migrations,
  # GoTrue JWTs, PostgREST and the Edge Runtime serving the functions generated
  # from base44/functions. Throwaway: nothing here touches the real project.
  supabase-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: node scripts/generate-supabase-functions.mjs
      - run: supabase start -x studio,imgproxy,storage-api,logflare,vector,supavisor,postgres-meta,realtime
      - name: Serve the generated functions
        run: |
          supabase functions serve > functions.log 2>&1 &
          eval "$(supabase status -o env)"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$API_URL/functions/v1/stations" -H "apikey: $ANON_KEY" || true)
            [ "$code" = "204" ] && echo "functions up after ${i}s" && exit 0
            sleep 1
          done
          cat functions.log; exit 1
      - name: Integration tests
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_ANON_KEY="$ANON_KEY" \
            deno test --node-modules-dir=none --allow-env --allow-net supabase/tests/integration/
      - if: failure()
        run: cat functions.log || true
