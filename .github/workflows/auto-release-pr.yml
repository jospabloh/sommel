name: Auto Release PR

# Module 6: the version and the in-app changelog are written ONLY by
# `npm run release` (scripts/publish-release.mjs), never by hand per feature.
# On every push to main this opens (or refreshes) one release PR on the
# automated/release-pr branch. Merging that PR is the release. It changes
# src/lib/appConfig.js and package.json together; `npm run lint` runs
# check:version on the PR, so the two cannot drift.
#
# Secrets (all optional):
#   ANTHROPIC_API_KEY_SOMMEL  rewrites PR titles into short Spanish lines. Without
#                             it the PR titles go into the changelog verbatim.
#   RELEASE_PR_PAT            a PR opened with the default GITHUB_TOKEN does not
#                             trigger other workflows (GitHub's anti-recursion
#                             rule), so CI would never run on the release PR.
#                             A repo-scoped PAT (contents + pull requests write)
#                             fixes that; it falls back to GITHUB_TOKEN.
# The repo setting "Allow GitHub Actions to create and approve pull requests"
# must be on, or the last step fails.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-release-pr
  cancel-in-progress: false

jobs:
  auto-release:
    # Skip the merge of the release PR itself (it would otherwise release again)
    # and anything the bot pushed.
    if: "!startsWith(github.event.head_commit.message, 'chore: release') && !contains(github.event.head_commit.message, 'automated/release-pr') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script needs history to find the last release commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run release script
        env:
          CI: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY_SOMMEL: ${{ secrets.ANTHROPIC_API_KEY_SOMMEL }}
        run: npm run release
      - name: Open the release PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}
          commit-message: 'chore: release and update changelog'
          branch: automated/release-pr
          title: 'chore: release and update changelog'
          body: |
            Generated by `npm run release` (scripts/publish-release.mjs).

            - Bumps `APP_VERSION` and `RELEASE_DATE` in `src/lib/appConfig.js` and `version` in `package.json` together.
            - Adds a changelog entry built from the pull requests merged since the last release.

            Merging this is the release. Merging does not deploy: publish from Base44 and verify the served bundle by content.
          labels: automated-release
          delete-branch: true
