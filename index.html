<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6ab41c2a89f592a0eca074d2/068ca3173_Sommel_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sommel</title>
    <!--
      Pre-mount theme script (module 12, fixed 2026-09-28). Runs synchronously
      before React mounts (plain classic script, not type="module" — those are
      deferred) so the FIRST frame already paints in the right color instead
      of flashing the wrong theme. Shares its localStorage key/values with
      src/lib/useTheme.js, which is what applies a theme change live after
      mount — each file comments at the other so they don't drift apart.
    -->
    <script>
      (function () {
        try {
          var KEY = 'sommel-theme'; // 'light' | 'dark' | 'system'
          var pref = localStorage.getItem(KEY) || 'system';
          var resolved =
            pref === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : pref;
          var root = document.documentElement;
          if (resolved === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
          root.style.colorScheme = resolved;
        } catch (e) {
          // localStorage blocked (private mode, etc.) — fall back to dark,
          // Sommel's original-and-only look, rather than an unstyled flash.
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
