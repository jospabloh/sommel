<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6ab41c2a89f592a0eca074d2/068ca3173_Sommel_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sommel</title>
    <!--
      Pre-mount theme script (module 12). Runs synchronously before React
      mounts (plain classic script, not type="module", those are deferred) so
      the FIRST frame already paints in the right color instead of flashing the
      wrong theme. Shares its localStorage key and its three values
      ('light' | 'dark' | 'system') with src/lib/ThemeContext.jsx, which
      applies a change live after mount. Each file comments at the other so
      they don't drift apart. Anything that is not 'light' or 'dark' (missing,
      corrupt, storage blocked) resolves as 'system', exactly like the provider.
    -->
    <script>
      (function () {
        var resolved = 'light';
        try {
          var KEY = 'sommel-theme'; // keep equal to STORAGE_KEY in src/lib/ThemeContext.jsx
          var pref = null;
          try { pref = localStorage.getItem(KEY); } catch (e) { /* blocked: follow the device */ }
          if (pref !== 'light' && pref !== 'dark') pref = 'system';
          resolved = pref;
          if (pref === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch (e) {
          resolved = 'light';
        }
        var root = document.documentElement;
        if (resolved === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
        root.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
